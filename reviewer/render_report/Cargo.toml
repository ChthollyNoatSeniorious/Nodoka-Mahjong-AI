[package]
name = "render-report"
version = "0.1.0"
edition = "2021"
description = "Render mjai-reviewer-style HTML from an existing bigcoach review JSON"

[dependencies]
serde_json = "1"
tera = "1"
minify-html = "0.15"
fluent-templates = { version = "0.8.0", features = ["tera"] }
anyhow = "1"

[profile.release]
opt-level = 2

